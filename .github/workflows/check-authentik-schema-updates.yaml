# Checks daily for changes to authentik's OpenAPI schema and dispatches the
# client-generation workflow when an update is detected.
name: Check authentik schema for updates

on:
  schedule:
    # Daily at 6:00.
    - cron: '0 6 * * *'
      timezone: "Europe/Berlin"
  workflow_dispatch:

jobs:
  check-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      update-required: ${{ steps.schema-diff.outputs.updated }}

    steps:
      - name: Checkout `.authentik/schema.yaml`
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .authentik/schema.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Curl Options: Fail on HTTP errors; silent; show error on failure; follow redirects.
      - name: Fetch upstream `schema.yml`
        run: curl -fsSL https://raw.githubusercontent.com/goauthentik/authentik/main/schema.yml -o /tmp/schema.yaml

      - name: Compare upstream `schema.yml` with local copy
        id: schema-diff
        run: |
          if diff -q /tmp/schema.yaml ./.authentik/schema.yaml; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

  update-client:
    needs: check-schema
    if: needs.check-schema.outputs.update-required == 'true'
    permissions:
      contents: write
      pull-requests: write
    secrets:
      PAT: ${{ secrets.PAT }}
    uses: $/.github/workflows/update-openapi-client.yaml
