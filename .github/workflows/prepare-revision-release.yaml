# Prepares a revision release of a release line, i.e., a gem release without a
# new authentik version, e.g., to ship a tooling fix that was backported to the
# line.
#
# The revision is appended to the authentik version: `2026.8.3` becomes
# `2026.8.3.1`, then `2026.8.3.2`; `2026.11.0.rc1` becomes `2026.11.0.rc1.1`.
# RubyGems sorts a revision after its base version and before the next
# authentik release.
#
# Regenerates the client with the revision as the gem version and opens a PR
# labeled `release` into the release line. Merging it publishes the gem via
# `release-gem.yaml`.
name: Prepare revision release

on:
  workflow_dispatch:
    inputs:
      branch-name:
        description: "Release line to prepare the revision release for (e.g., 2026.8)"
        required: true
        type: string

env:
  OPENAPI_GENERATOR_PATH: "tmp"

jobs:
  build-client:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ inputs.branch-name }}
    steps:
      - name: Validate release branch
        run: |
          if [[ ! "$BASE_BRANCH" =~ ^[0-9]{4}\.[0-9]+$ ]]; then
            echo "::error::'$BASE_BRANCH' is not a release branch (expected e.g. 2026.2)."
            exit 1
          fi

      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Determine revision
        run: |
          AUTHENTIK_VERSION=$(yq -r '.info.version' .authentik/schema.yaml)
          base="${AUTHENTIK_VERSION//-/.}"
          if ! git rev-parse -q --verify "refs/tags/v$base" > /dev/null; then
            echo "::error::v$base is not released yet. Merge the release PR for $AUTHENTIK_VERSION first."
            exit 1
          fi

          last=$(git tag -l "v$base.*" | sed "s/^v$base\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
          previous="v$base${last:+.$last}"
          GEM_VERSION="$base.$(( ${last:-0} + 1 ))"
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse "$previous^{commit}")" ]]; then
            echo "::error::$BASE_BRANCH has no changes since $previous."
            exit 1
          fi

          echo "Preparing $GEM_VERSION (previous release: $previous)."
          {
            echo "AUTHENTIK_VERSION=$AUTHENTIK_VERSION"
            echo "GEM_VERSION=$GEM_VERSION"
            echo "PREVIOUS_TAG=$previous"
          } >> "$GITHUB_ENV"

      - name: Build OpenAPI client
        uses: $/.github/actions/build-openapi-client
        with:
          output-path: ${{ env.OPENAPI_GENERATOR_PATH }}
          config-file: ./.openapi-generator/config.yaml
          openapi-file: ./.authentik/schema.yaml
          templates-dir: ./.openapi-generator/ruby-templates
          gem-version: ${{ env.GEM_VERSION }}

      - name: Write pull request body
        run: |
          {
            echo "Revision release of the \`$BASE_BRANCH\` line. The authentik version stays at \`$AUTHENTIK_VERSION\`."
            echo
            echo "Gem version: \`$GEM_VERSION\`"
            echo "Changes since the previous release: [$PREVIOUS_TAG...$BASE_BRANCH]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREVIOUS_TAG...$BASE_BRANCH)"
            echo
            echo "Merging this PR publishes the gem."
          } > "$RUNNER_TEMP/pull-request-body.md"

      - name: Create pull request for release
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PAT }} # Need separate token to trigger workflows. # zizmor: ignore[secrets-outside-env]
          commit-message: "Release ${{ env.GEM_VERSION }}"
          branch: "actions/release/revision/${{ env.GEM_VERSION }}"
          base: ${{ env.BASE_BRANCH }}
          title: "Release ${{ env.GEM_VERSION }}"
          body-path: ${{ runner.temp }}/pull-request-body.md
          labels: release
          delete-branch: true
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Check outputs
        if: ${{ steps.pull-request.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${PULL_REQUEST_NUMBER}"
          echo "Pull Request URL - ${PULL_REQUEST_URL}"
        env:
          PULL_REQUEST_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.pull-request-url }}
