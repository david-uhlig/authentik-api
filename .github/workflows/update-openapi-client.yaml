# Generates the OpenAPI client on the main branch and opens a PR for review.
#
# Review the PR and merge into `main`. Release lines (e.g., `2026.11`) are
# created by `update-openapi-client-on-release.yaml`, never by this workflow.
#
# Detection logic for changes is in `check-authentik-schema-updates.yaml`.
# This workflow runs regardless of changes.
#
# Keep this file in "sync" with `update-openapi-client-on-release.yaml`.
name: Update OpenAPI client

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      PAT:
        required: true

jobs:
  fetch-schema:
    permissions:
      contents: read
    uses: $/.github/workflows/fetch-authentik-schema.yaml
    with:
      schema-url: "https://raw.githubusercontent.com/goauthentik/authentik/main/schema.yml"

  build-client:
    permissions:
      contents: write
      pull-requests: write
    needs: fetch-schema
    runs-on: ubuntu-latest
    env:
      AUTHENTIK_VERSION: ${{ needs.fetch-schema.outputs.authentik-version }} # 2026.2.0-rc1
      GEM_VERSION: ${{ needs.fetch-schema.outputs.gem-version }} # 2026.2.0.rc1
      BASE_BRANCH: main
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false

      - name: Download schema artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.fetch-schema.outputs.schema-artifact }}
          path: ./.authentik/

      - name: Build OpenAPI client
        uses: $/.github/actions/build-openapi-client
        with:
          gem-version: ${{ env.GEM_VERSION }}

      - name: Create pull request
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PAT }} # Need separate token to trigger workflows. # zizmor: ignore[secrets-outside-env]
          commit-message: "Update OpenAPI client"
          branch: "actions/nightly-update"
          base: main
          title: "Nightly update"
          body: |
            This automatic update includes changes from the latest upstream `main` branch schema updates.

            Authentik version: `${{ env.AUTHENTIK_VERSION }}`
            Schema source: [goauthentik/authentik@main](https://github.com/goauthentik/authentik/blob/main/schema.yml)
            
            Please review the generated changes before merging.
          labels: nightly
          delete-branch: true
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Check outputs
        if: ${{ steps.pull-request.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${PULL_REQUEST_NUMBER}"
          echo "Pull Request URL - ${PULL_REQUEST_URL}"
        env:
          PULL_REQUEST_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.pull-request-url }}

      - name: Enable auto-merge
        if: ${{ steps.pull-request.outputs.pull-request-number }}
        run: |
          gh pr merge --rebase --auto "${PULL_REQUEST_NUMBER}"
        env:
          GH_TOKEN: ${{ secrets.PAT }} # zizmor: ignore[secrets-outside-env]
          PULL_REQUEST_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
