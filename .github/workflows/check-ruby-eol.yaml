# Checks Ruby's end-of-life status against the minimum required Ruby version
# of this library.
#
# When the minimum required Ruby version has reached end-of-life, this workflow
# bumps it to the oldest still-supported Ruby release and opens a pull request.
# See `.github/scripts/ruby_eol.rb` for the files it updates.
#
# EOL data is sourced from https://endoflife.date/ruby
name: Check Ruby EOL

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 1 * *" # First of every month at noon Berlin time.
      timezone: "Europe/Berlin"

# The pull request is created with a GitHub App token, so `GITHUB_TOKEN` only
# needs read access.
permissions:
  contents: read

jobs:
  check-ruby-eol:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ruby

      - name: Bump Ruby version if end-of-life
        id: eol
        run: .github/scripts/ruby_eol.rb

      # Separate token so CI runs on the PR.
      - name: Create GitHub App token
        if: steps.eol.outputs.new-version
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request
        if: steps.eol.outputs.new-version
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "Bump Ruby version requirement to ${{ steps.eol.outputs.new-version }}"
          branch: "ruby-eol-bump/${{ steps.eol.outputs.new-version }}"
          base: main
          title: "Bump Ruby version requirement to ${{ steps.eol.outputs.new-version }}"
          body: |
            Ruby ${{ steps.eol.outputs.current-version }} has reached end-of-life.

            This PR bumps the minimum required Ruby version to ${{ steps.eol.outputs.new-version }}.

            Updated files:
            - `*.gemspec`
            - `.openapi-generator/config.yaml`
            - `mise.toml`
            - `.standard.yml`

            The CI test matrix follows the gemspec, so it drops Ruby ${{ steps.eol.outputs.current-version }} by itself.

            > EOL data sourced from [endoflife.date](https://endoflife.date/ruby)
          reviewers: david-uhlig
          delete-branch: true
