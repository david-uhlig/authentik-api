# Monitors the `goauthentik/authentik` repository for new release tags.
#
# Covers every `version/X.Y.Z[-suffix]` tag at or above `SOURCE_MIN_VERSION`:
# * Final releases, e.g., `version/2026.5.0`, `version/2026.5.3`.
# * Release candidates of minor releases, e.g., `version/2026.8.0-rc1`.
# * Release candidates of patch releases, e.g., `version/2026.5.3-rc1`.
#
# When new tags are found:
# * Skips tags that are already known, i.e., a PR branch
#   (`actions/release/version/2026.5.3-rc1`) or a gem tag (`v2026.5.3.rc1`)
#   exists in this repository.
# * Dispatches builder workflows for unknown tags.
name: Check authentik for new tags (releases)

on:
  schedule:
    - cron: '15 6 * * *'
      timezone: "Europe/Berlin"
  workflow_dispatch:

env:
  SOURCE_OWNER: goauthentik
  SOURCE_REPO: authentik
  # Number of most recent upstream tags to inspect. Keep generous: RCs and
  # patch releases of several release lines can arrive between two runs.
  SOURCE_LATEST_TAGS_NUM: 50
  SOURCE_MIN_VERSION: "2026.5.0"
  AUTO_PR_BRANCH_PREFIX: "actions/release/"

jobs:
  check-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.set-tags.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - id: get-branches
        name: Get local branches
        run: |
          BRANCHES=$(git branch --remotes --format='%(refname:short)' | sed -E 's/^origin\/?//' | awk NF | jq -Rnc '[inputs]')
          echo "BRANCHES=$BRANCHES" >> "$GITHUB_ENV"

      - id: get-tags
        name: Get local tags
        run: |
          TAGS=$(git tag | jq -Rnc '[inputs]')
          echo "TAGS=$TAGS" >> "$GITHUB_ENV"          

      - id: get-missing-tags
        name: Get missing authentik tags
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // authentik
            const owner = process.env.SOURCE_OWNER;
            const repo = process.env.SOURCE_REPO;
            const lookupTagsNum = process.env.SOURCE_LATEST_TAGS_NUM;
            const response = await github.rest.repos.listTags({owner, repo, per_page: lookupTagsNum});
            
            // authentik-api
            const prBranchPrefix = process.env.AUTO_PR_BRANCH_PREFIX;
            const branches = JSON.parse(process.env.BRANCHES);
            const tags = JSON.parse(process.env.TAGS);
            
            // Compare major.minor.patch numerically; a string comparison would
            // sort `2026.11.0` before `2026.5.0`. The pre-release suffix is
            // ignored, so RCs of any minor or patch release at or above the
            // minimum are included (e.g., `2026.5.0-rc1`, `2026.5.3-rc1`).
            const toNums = v => v.split('-')[0].split('.').map(Number);
            const compare = (a, b) => {
              for (let i = 0; i < 3; i++) {
                if (a[i] !== b[i]) return a[i] - b[i];
              }
              return 0;
            };
            const minVersion = toNums(process.env.SOURCE_MIN_VERSION);

            let akTags = response
              .data
              .map(t => t.name) // e.g., `version/2026.2.2-rc2`
              .filter(t => /^version\/\d+\.\d+\.\d+(-.+)?$/.test(t))
              .filter(t => compare(toNums(t.replace('version/', '')), minVersion) >= 0);
            core.info(`Found ${akTags.length} authentik tags >= ${process.env.SOURCE_MIN_VERSION}`);
            core.info(akTags.join(', '));
            
            // Remove authentik tags that already exist as a tag or PR branch in this repo.
            // authentik tag: `version/2026.2.2-rc2`
            // branch: `actions/release/version/2026.2.2-rc2`
            // tag: `v2026.2.2.rc2`
            akTags = akTags
              .filter(t => !branches.includes(`${prBranchPrefix}${t}`))
              .filter(t => !tags.includes('v' + t.replace('version/', '').replace('-', '.')));
            
            core.setOutput('tags', JSON.stringify(akTags));
            core.info(`Found ${akTags.length} new authentik tags`);
            core.info(akTags.join(', '));

      - id: set-tags
        name: Set tags
        env:
          TAGS_JSON: ${{ steps.get-missing-tags.outputs.tags }}
        run: |
          {
            echo "tags<<JSON"
            echo "$TAGS_JSON"
            echo "JSON"
          } >> "$GITHUB_OUTPUT"

  update-client:
    needs: check-tags
    permissions:
      contents: write
      issues: write # Backport labels for new release lines.
      pull-requests: write
    if: ${{ needs.check-tags.outputs.tags != '[]' }}
    strategy:
      fail-fast: true
      max-parallel: 1 # Prevent race conditions when creating a release line, e.g. `2026.2`.
      matrix:
        tag: ${{ fromJSON(needs.check-tags.outputs.tags) }}
    secrets:
      PAT: ${{ secrets.PAT }}
    uses: $/.github/workflows/update-openapi-client-on-release.yaml
    with:
      tag-name: ${{ matrix.tag }}
