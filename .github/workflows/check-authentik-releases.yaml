# Monitors the `goauthentik/authentik` repository for new release tags.
#
# Covers every `version/X.Y.Z[-suffix]` tag at or above `SOURCE_MIN_VERSION`:
# * Final releases, e.g., `version/2026.5.0`, `version/2026.5.3`.
# * Release candidates of minor releases, e.g., `version/2026.8.0-rc1`.
# * Release candidates of patch releases, e.g., `version/2026.5.3-rc1`.
#
# Releases are queued per release line (e.g. `2026.11`), so that release PRs
# never conflict with each other:
# * Skips tags at or below the line's latest gem release (e.g. `v2026.5.7`).
# * Skips the whole line while one of its release PRs is open, i.e., a PR
#   branch like `actions/release/version/2026.5.3-rc1` exists.
# * Otherwise dispatches the builder workflow for the line's oldest unreleased
#   tag only.
#
# `release-gem.yaml` runs this workflow again after each release, so the next
# queued release of a line follows right after the previous one is merged.
name: Check authentik for new tags (releases)

on:
  schedule:
    - cron: '15 6 * * *'
      timezone: "Europe/Berlin"
  workflow_dispatch:

env:
  SOURCE_OWNER: goauthentik
  SOURCE_REPO: authentik
  # Number of most recent upstream tags to inspect. Keep generous: RCs and
  # patch releases of several release lines can arrive between two runs.
  SOURCE_LATEST_TAGS_NUM: 50
  SOURCE_MIN_VERSION: "2026.5.0"
  AUTO_PR_BRANCH_PREFIX: "actions/release/"

jobs:
  check-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.set-tags.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - id: get-branches
        name: Get local branches
        run: |
          BRANCHES=$(git branch --remotes --format='%(refname:short)' | sed -E 's/^origin\/?//' | awk NF | jq -Rnc '[inputs]')
          echo "BRANCHES=$BRANCHES" >> "$GITHUB_ENV"

      - id: get-tags
        name: Get local tags
        run: |
          TAGS=$(git tag | jq -Rnc '[inputs]')
          echo "TAGS=$TAGS" >> "$GITHUB_ENV"          

      - id: get-missing-tags
        name: Get missing authentik tags
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // authentik
            const owner = process.env.SOURCE_OWNER;
            const repo = process.env.SOURCE_REPO;
            const lookupTagsNum = process.env.SOURCE_LATEST_TAGS_NUM;
            const response = await github.rest.repos.listTags({owner, repo, per_page: lookupTagsNum});
            
            // authentik-api
            const prBranchPrefix = process.env.AUTO_PR_BRANCH_PREFIX;
            const branches = JSON.parse(process.env.BRANCHES);
            const tags = JSON.parse(process.env.TAGS);
            
            // Versions are compared numerically on major.minor.patch; a string
            // comparison would sort `2026.11.0` before `2026.5.0`. A pre-release
            // sorts before its final release, `rc2` after `rc1`. RCs of minor
            // and patch releases are included (e.g., `2026.5.0-rc1`, `2026.5.3-rc1`).
            const parse = v => {
              const [nums, pre = null] = v.split('-');
              return {nums: nums.split('.').map(Number), pre};
            };
            const preNum = pre => Number((pre.match(/\d+$/) || ['0'])[0]);
            const compare = (a, b) => {
              for (let i = 0; i < 3; i++) {
                if (a.nums[i] !== b.nums[i]) return a.nums[i] - b.nums[i];
              }
              if (a.pre === b.pre) return 0;
              if (a.pre === null) return 1;
              if (b.pre === null) return -1;
              return preNum(a.pre) - preNum(b.pre) || a.pre.localeCompare(b.pre);
            };
            const lineOf = v => parse(v).nums.slice(0, 2).join('.');
            const minVersion = parse(process.env.SOURCE_MIN_VERSION);

            // e.g., `2026.2.2-rc2` from the tag `version/2026.2.2-rc2`
            const akVersions = response
              .data
              .map(t => t.name)
              .filter(t => /^version\/\d+\.\d+\.\d+(-.+)?$/.test(t))
              .map(t => t.replace('version/', ''))
              .filter(v => compare(parse(v), minVersion) >= 0);
            core.info(`Found ${akVersions.length} authentik tags >= ${process.env.SOURCE_MIN_VERSION}`);
            core.info(akVersions.join(', '));

            // Latest gem release per line, revisions ignored. Gem tags look like
            // `v2026.8.3`, `v2026.8.3.1`, `v2026.11.0.rc1`, `v2026.11.0.rc1.1`.
            const released = {};
            for (const tag of tags) {
              const m = tag.match(/^v(\d+\.\d+\.\d+)(?:\.([A-Za-z]+\d*))?(?:\.\d+)?$/);
              if (!m) continue;
              const version = m[2] ? `${m[1]}-${m[2]}` : m[1];
              const line = lineOf(version);
              if (!released[line] || compare(parse(version), parse(released[line])) > 0) {
                released[line] = version;
              }
            }

            // Unreleased versions per line, i.e., newer than the line's latest release.
            const unreleased = {};
            for (const v of akVersions) {
              const line = lineOf(v);
              if (released[line] && compare(parse(v), parse(released[line])) <= 0) continue;
              (unreleased[line] ||= []).push(v);
            }

            // One release PR per line at a time: the oldest unreleased version,
            // unless a release PR of the line is still open.
            const akTags = [];
            for (const [line, versions] of Object.entries(unreleased)) {
              versions.sort((a, b) => compare(parse(a), parse(b)));
              const open = versions.filter(v => branches.includes(`${prBranchPrefix}version/${v}`));
              if (open.length > 0) {
                core.info(`${line}: waiting for the open release PR of ${open.join(', ')}. Queued: ${versions.join(', ')}`);
                continue;
              }
              core.info(`${line}: building ${versions[0]}. Queued after it: ${versions.slice(1).join(', ') || 'none'}`);
              akTags.push(`version/${versions[0]}`);
            }

            core.setOutput('tags', JSON.stringify(akTags));
            core.info(`Building ${akTags.length} release(s): ${akTags.join(', ') || 'none'}`);

      - id: set-tags
        name: Set tags
        env:
          TAGS_JSON: ${{ steps.get-missing-tags.outputs.tags }}
        run: |
          {
            echo "tags<<JSON"
            echo "$TAGS_JSON"
            echo "JSON"
          } >> "$GITHUB_OUTPUT"

  update-client:
    needs: check-tags
    permissions:
      contents: write
      issues: write # Backport labels for new release lines.
      pull-requests: write
    if: ${{ needs.check-tags.outputs.tags != '[]' }}
    strategy:
      fail-fast: true
      max-parallel: 1 # Prevent race conditions when creating a release line, e.g. `2026.2`.
      matrix:
        tag: ${{ fromJSON(needs.check-tags.outputs.tags) }}
    secrets:
      PAT: ${{ secrets.PAT }}
    uses: $/.github/workflows/update-openapi-client-on-release.yaml
    with:
      tag-name: ${{ matrix.tag }}
