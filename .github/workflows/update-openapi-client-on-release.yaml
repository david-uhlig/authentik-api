# Generates the OpenAPI client for an authentik release and opens a PR for review.
#
# 1. Review the PR and merge.
# 2. Tag release.
# 3. Publish gem.
#
# Keep this file in "sync" with `update-openapi-client.yaml`.
name: Update OpenAPI client (new release)

on:
  workflow_dispatch:
    inputs:
      tag-name:
        description: "The authentik version tag, e.g. 'version/2026.2.0'"
        required: true
        type: string
  workflow_call:
    inputs:
      tag-name:
        description: "The authentik version tag detected by the calling workflow."
        required: true
        type: string
    secrets:
      PAT:
        required: true

env:
  OPENAPI_GENERATOR_PATH: "tmp"

jobs:
  prepare-release-branch:
    permissions:
      contents: write
    uses: $/.github/workflows/prepare-release-branch.yaml
    with:
      schema-url: "https://raw.githubusercontent.com/goauthentik/authentik/${{ inputs.tag-name }}/schema.yml"

  build-client:
    permissions:
      contents: write
      pull-requests: write
    needs: prepare-release-branch
    runs-on: ubuntu-latest
    env:
      AUTHENTIK_VERSION: ${{ needs.prepare-release-branch.outputs.authentik-version }} # 2026.2.0-rc1
      GEM_VERSION: ${{ needs.prepare-release-branch.outputs.gem-version }} # 2026.2.0.rc1
      BASE_BRANCH: ${{ needs.prepare-release-branch.outputs.release-branch }} # 2026.2
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false

      - name: Download schema artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare-release-branch.outputs.schema-artifact }}
          path: ./.authentik/

      - name: Build OpenAPI client
        uses: $/.github/actions/build-openapi-client
        with:
          output-path: ${{ env.OPENAPI_GENERATOR_PATH }}
          config-file: ./.openapi-generator/config.yaml
          openapi-file: ./.authentik/schema.yaml
          templates-dir: ./.openapi-generator/ruby-templates
          gem-version: ${{ env.GEM_VERSION }}

      - name: Create pull request for release
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PAT }} # Need separate token to trigger workflows. # zizmor: ignore[secrets-outside-env]
          commit-message: "Update OpenAPI client (${{ env.AUTHENTIK_VERSION }})"
          branch: "actions/release/version/${{ env.AUTHENTIK_VERSION }}"
          base: "${{ needs.prepare-release-branch.outputs.release-branch }}"
          title: "Update for authentik release ${{ env.AUTHENTIK_VERSION }}"
          body: |
            This automatic update includes changes from the authentik release `${{ env.AUTHENTIK_VERSION }}`.
  
            Authentik version: `${{ env.AUTHENTIK_VERSION }}`
            Schema source: [goauthentik/authentik@${{ inputs.tag-name }}](https://github.com/goauthentik/authentik/blob/${{ inputs.tag-name }}/schema.yml)
            Gem version: `${{ env.GEM_VERSION }}`
            
            Please review the generated changes before merging.
          labels: release
          delete-branch: true
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Check outputs
        if: ${{ steps.pull-request.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${PULL_REQUEST_NUMBER}"
          echo "Pull Request URL - ${PULL_REQUEST_URL}"
        env:
          PULL_REQUEST_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.pull-request-url }}
