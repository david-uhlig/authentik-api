# Generates the OpenAPI client for an authentik release and opens a PR for review.
#
# Every authentik minor version has a release line branch in this repository,
# e.g. `2026.11`. All gem releases of that minor version are published from it.
#
# * First release of a line (e.g., `2026.11.0-rc1`): the branch is created
#   from the previous release tag (e.g., `v2026.8.3`), not from `main`. The PR
#   has two commits that are best reviewed separately:
#   1. Adopt tooling from main: `main`'s tooling, regenerated from the previous
#      release's schema. Shows the tooling changes only.
#   2. Update OpenAPI client: regenerated from the new schema. Shows the API
#      changes only.
# * Later releases of a line (RCs, patches): regenerated on the release line
#   with the line's own tooling. Tooling fixes reach a line via backports.
#
# Afterwards:
# 1. Review the PR and merge.
# 2. `release-gem.yaml` tags the release and publishes the gem.
#
# Keep this file in "sync" with `update-openapi-client.yaml`.
name: Update OpenAPI client (new release)

on:
  workflow_dispatch:
    inputs:
      tag-name:
        description: "The authentik version tag, e.g. 'version/2026.2.0'"
        required: true
        type: string
  workflow_call:
    inputs:
      tag-name:
        description: "The authentik version tag detected by the calling workflow."
        required: true
        type: string
    secrets:
      PAT:
        required: true

jobs:
  fetch-schema:
    permissions:
      contents: read
    uses: $/.github/workflows/fetch-authentik-schema.yaml
    with:
      schema-url: "https://raw.githubusercontent.com/goauthentik/authentik/${{ inputs.tag-name }}/schema.yml"

  prepare-release-line:
    permissions:
      contents: write # Create the release line branch.
      issues: write # Create the backport label.
    needs: fetch-schema
    runs-on: ubuntu-latest
    outputs:
      release-branch: ${{ steps.release-line.outputs.release-branch }}
      new-line: ${{ steps.release-line.outputs.new-line }}
      base-version: ${{ steps.release-line.outputs.base-version }}
    env:
      RELEASE_LINE: ${{ needs.fetch-schema.outputs.release-line }} # 2026.2
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # A line counts as new until its first release PR is merged, i.e., while
      # its schema still belongs to an older minor version.
      - name: Find or create release line
        id: release-line
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse -q --verify "refs/remotes/origin/$RELEASE_LINE" > /dev/null; then
            line_ref="origin/$RELEASE_LINE"
            line_schema_version=$(git show "$line_ref:.authentik/schema.yaml" | yq -r '.info.version')
            echo "Release line $RELEASE_LINE exists, its schema version is $line_schema_version."
            if [[ "$line_schema_version" == "$RELEASE_LINE".* ]]; then
              new_line=false
            else
              new_line=true
            fi
          else
            # Latest final release (incl. revisions) of an older minor version,
            # e.g., `v2026.8.3.1` for the `2026.11` line.
            line_ref=$(git tag -l 'v*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$' \
              | sort -V \
              | awk -v line="$RELEASE_LINE" '
                  BEGIN { split(line, l, ".") }
                  { split(substr($0, 2), v, "."); if (v[1] < l[1] || (v[1] == l[1] && v[2] < l[2])) base = $0 }
                  END { print base }')
            if [[ -z "$line_ref" ]]; then
              echo "::error::No previous release found to create the release line $RELEASE_LINE from."
              exit 1
            fi
            echo "Creating release line $RELEASE_LINE from $line_ref."
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$RELEASE_LINE" \
              -f sha="$(git rev-parse "$line_ref^{commit}")" > /dev/null
            gh label create "backport $RELEASE_LINE" \
              --repo "$GITHUB_REPOSITORY" \
              --color "c5def5" \
              --description "Backport the merged PR to the $RELEASE_LINE release line" \
              --force
            new_line=true
          fi

          base_version=$(git show "$line_ref:lib/authentik/api/version.rb" | sed -nE "s/^ *VERSION = '([^']+)'.*$/\1/p")
          echo "Release line $RELEASE_LINE is at version $base_version, new line: $new_line."
          {
            echo "release-branch=$RELEASE_LINE"
            echo "new-line=$new_line"
            echo "base-version=$base_version"
          } >> "$GITHUB_OUTPUT"

  build-client:
    permissions:
      contents: write
      pull-requests: write
    needs: [fetch-schema, prepare-release-line]
    runs-on: ubuntu-latest
    env:
      AUTHENTIK_VERSION: ${{ needs.fetch-schema.outputs.authentik-version }} # 2026.2.0-rc1
      GEM_VERSION: ${{ needs.fetch-schema.outputs.gem-version }} # 2026.2.0.rc1
      BASE_BRANCH: ${{ needs.prepare-release-line.outputs.release-branch }} # 2026.2
      BASE_VERSION: ${{ needs.prepare-release-line.outputs.base-version }} # 2025.12.4
      NEW_LINE: ${{ needs.prepare-release-line.outputs.new-line }}
      TAG_NAME: ${{ inputs.tag-name }} # version/2026.2.0-rc1
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0 # `origin/main` is needed for a new release line.
          persist-credentials: false

      # Replace the whole tree with `main`'s, except for the schema of the
      # previous release. Files deleted on `main` are deleted here, too.
      - name: Adopt tooling from main
        if: env.NEW_LINE == 'true'
        run: |
          MAIN_SHA=$(git rev-parse origin/main)
          git restore --source="$MAIN_SHA" --staged --worktree -- .
          git restore --source=HEAD --staged --worktree -- .authentik/schema.yaml
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"

      - name: Build OpenAPI client (previous release, tooling from main)
        if: env.NEW_LINE == 'true'
        uses: $/.github/actions/build-openapi-client
        with:
          gem-version: ${{ env.BASE_VERSION }}

      - name: Commit tooling from main
        if: env.NEW_LINE == 'true'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Tooling on main is unchanged since $BASE_VERSION."
            exit 0
          fi
          git \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit \
            -m "Adopt tooling from main (${MAIN_SHA::7})" \
            -m "Regenerates $BASE_VERSION with the tooling from main@$MAIN_SHA, so that the next commit only contains API changes."

      - name: Download schema artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.fetch-schema.outputs.schema-artifact }}
          path: ./.authentik/

      - name: Build OpenAPI client
        uses: $/.github/actions/build-openapi-client
        with:
          gem-version: ${{ env.GEM_VERSION }}

      - name: Write pull request body
        run: |
          {
            echo "This automatic update includes changes from the authentik release \`$AUTHENTIK_VERSION\`."
            echo
            echo "Authentik version: \`$AUTHENTIK_VERSION\`"
            echo "Schema source: [goauthentik/authentik@$TAG_NAME](https://github.com/goauthentik/authentik/blob/$TAG_NAME/schema.yml)"
            echo "Gem version: \`$GEM_VERSION\`"
            echo "Previous release on this line: \`$BASE_VERSION\`"
            echo
            if [[ "$NEW_LINE" == "true" ]]; then
              echo "This is the first release of the \`$BASE_BRANCH\` line. The branch was created from \`$BASE_VERSION\`. Review the commits separately:"
              echo
              echo "1. **Adopt tooling from main**: regenerates \`$BASE_VERSION\` with the tooling from main@$MAIN_SHA. Contains tooling changes only. Missing if the tooling is unchanged."
              echo "2. **Update OpenAPI client**: regenerates the client from the \`$AUTHENTIK_VERSION\` schema. Contains API changes only."
              echo
            fi
            echo "Please review the generated changes before merging."
          } > "$RUNNER_TEMP/pull-request-body.md"

      - name: Create pull request for release
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PAT }} # Need separate token to trigger workflows. # zizmor: ignore[secrets-outside-env]
          commit-message: "Update OpenAPI client (${{ env.AUTHENTIK_VERSION }})"
          branch: "actions/release/version/${{ env.AUTHENTIK_VERSION }}"
          base: ${{ env.BASE_BRANCH }}
          title: "Update for authentik release ${{ env.AUTHENTIK_VERSION }}"
          body-path: ${{ runner.temp }}/pull-request-body.md
          labels: release
          delete-branch: true
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Check outputs
        if: ${{ steps.pull-request.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${PULL_REQUEST_NUMBER}"
          echo "Pull Request URL - ${PULL_REQUEST_URL}"
        env:
          PULL_REQUEST_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.pull-request-url }}
