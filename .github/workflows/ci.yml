# Runs Ruby tests and style checks across supported Ruby versions and lints
# GitHub Actions workflows.
name: Ruby Tests and Workflow Linting

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rake-on-ruby-matrix:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} (Test & Lint)
    strategy:
      matrix:
        ruby: ["3.3", "3.4", "4.0"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run standard code style checks
        run: bundle exec rake standard

      - name: Run the default task
        run: bundle exec rake

  lint-actions:
    name: GitHub Actions (Lint & vulnerability checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: kjanat/actionlint@08bb2c4f0d039744455b87aef1c647fb8b66d37b # v1.17.0

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ruby
          bundler-cache: true

      # `rake spec` and `rake standard` skip `.github/`, so the workflow scripts
      # are checked here. Their specs live outside `spec/`, which
      # `bin/generate-api` replaces.
      - name: Test workflow scripts
        run: bundle exec rspec .github/scripts/spec

      - name: Run standard code style checks on workflow scripts
        run: bundle exec standardrb .github/scripts
