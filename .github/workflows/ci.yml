# Runs Ruby tests and style checks across supported Ruby versions and lints
# GitHub Actions workflows.
#
# The tested Ruby versions are every maintained CRuby release from the
# gemspec's minimum Ruby version up, so the matrix follows new Ruby releases
# and end-of-life bumps by itself. Branch protection requires only the
# "CI passed" check, which succeeds when all other jobs do.
name: Ruby Tests and Workflow Linting

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  minimum-ruby-version:
    name: Read minimum Ruby version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: authentik-api.gemspec
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # e.g. `s.required_ruby_version = ">= 3.3.0"` → `3.3`
      - name: Read minimum Ruby version from the gemspec
        id: read
        run: |
          version=$(sed -nE 's/.*required_ruby_version = ">= ([0-9]+\.[0-9]+).*/\1/p' authentik-api.gemspec)
          if [[ -z "$version" ]]; then
            echo "::error::required_ruby_version not found in authentik-api.gemspec."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Maintained CRuby versions from https://cache.ruby-lang.org/pub/misc/ci_versions/cruby.json,
  # from the minimum up. Includes the minimum even if it is end-of-life.
  ruby-versions:
    needs: minimum-ruby-version
    uses: ruby/actions/.github/workflows/ruby_versions.yml@45f3750e656aa8f2d99910c02124f9e25d36b0db # master (2026-09-15)
    with:
      engine: cruby
      min_version: ${{ fromJSON(needs.minimum-ruby-version.outputs.version) }}

  rake-on-ruby-matrix:
    needs: ruby-versions
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} (Test & Lint)
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.ruby-versions.outputs.versions) }}
        exclude:
          - ruby: head

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run standard and the specs
        run: bundle exec rake

  lint-actions:
    name: GitHub Actions (Lint & vulnerability checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: kjanat/actionlint@08bb2c4f0d039744455b87aef1c647fb8b66d37b # v1.17.0

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ruby
          bundler-cache: true

      # `rake spec` and `rake standard` skip `.github/`, so the workflow scripts
      # are checked here. Their specs live outside `spec/`, which
      # `bin/generate-api` replaces.
      - name: Test workflow scripts
        run: bundle exec rspec .github/scripts/spec

      - name: Run standard code style checks on workflow scripts
        run: bundle exec standardrb .github/scripts

  # The only required status check. The Ruby jobs' names change with the
  # matrix, so they can't be required individually.
  ci-passed:
    name: CI passed
    if: always()
    needs: [minimum-ruby-version, ruby-versions, rake-on-ruby-matrix, lint-actions]
    runs-on: ubuntu-latest
    steps:
      - name: Check that all jobs succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
