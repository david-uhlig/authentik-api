# Downloads the authentik OpenAPI schema and derives the versions used by the
# client-generation workflows. Creates no branches.
#
# The downloaded schema is uploaded as an artifact named `schema-<version>`
# (exposed as the `schema-artifact` output) so that later jobs can reuse it
# without a second download. The name is unique per version because callers
# may run this workflow several times in one run (matrix).
name: Fetch authentik schema

on:
  workflow_call:
    inputs:
      schema-url:
        description: "URL to download the authentik OpenAPI schema from."
        required: true
        type: string
    outputs:
      authentik-version:
        description: "The authentik version extracted from the schema, e.g., 2026.2.2-rc1."
        value: ${{ jobs.fetch-schema.outputs.authentik-version }}
      gem-version:
        description: "The gem version based on the authentik version, e.g., 2026.2.2.rc1."
        value: ${{ jobs.fetch-schema.outputs.gem-version }}
      release-line:
        description: "The release line (major.minor) of the authentik version, e.g., 2026.2."
        value: ${{ jobs.fetch-schema.outputs.release-line }}
      schema-artifact:
        description: "Name of the uploaded schema artifact, e.g., schema-2026.2.2-rc1."
        value: ${{ jobs.fetch-schema.outputs.schema-artifact }}

permissions:
  contents: read

jobs:
  fetch-schema:
    runs-on: ubuntu-latest
    outputs:
      authentik-version: ${{ steps.versions.outputs.authentik-version }}
      gem-version: ${{ steps.versions.outputs.gem-version }}
      release-line: ${{ steps.versions.outputs.release-line }}
      schema-artifact: schema-${{ steps.versions.outputs.authentik-version }}
    steps:
      - name: Download authentik's OpenAPI document
        env:
          SCHEMA_URL: ${{ inputs.schema-url }}
        run: |
          echo "Downloading $SCHEMA_URL"
          curl -fsSL "$SCHEMA_URL" -o ./schema.yaml

      - name: Derive versions
        id: versions
        run: |
          AUTHENTIK_VERSION="$(yq -r '.info.version' ./schema.yaml)"
          if [[ ! "$AUTHENTIK_VERSION" =~ ^([0-9]{4}\.[0-9]+)\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Unexpected .info.version in schema.yaml: '$AUTHENTIK_VERSION'"
            exit 1
          fi
          {
            echo "authentik-version=$AUTHENTIK_VERSION"
            echo "gem-version=${AUTHENTIK_VERSION//-/.}"
            echo "release-line=${BASH_REMATCH[1]}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload schema artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-${{ steps.versions.outputs.authentik-version }}
          path: ./schema.yaml
