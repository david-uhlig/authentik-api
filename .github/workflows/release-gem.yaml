# Releases the gem to RubyGems.
#
# Automatically triggered when a PR labeled `release` merges into a release
# branch. When manually triggered, it releases the branch specified in the
# `branch-name` input. Fails if the branch is not a release branch (e.g.,
# `main`).
name: Release gem to RubyGems

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      branch-name:
        description: "Release branch to publish from (e.g., 2026.2)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  tag-release:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch-name || github.event.pull_request.base.ref }}
    steps:
      # Only release branches (e.g., `2026.2`) may be published, never `main`
      # or feature branches.
      - name: Validate release branch
        run: |
          if [[ ! "$RELEASE_BRANCH" =~ ^[0-9]{4}\.[0-9]+$ ]]; then
            echo "::error::'$RELEASE_BRANCH' is not a release branch (expected e.g. 2026.2)."
            exit 1
          fi

      - name: Checkout release branch  # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true # zizmor: ignore[cache-poisoning]
          ruby-version: ruby

      - name: Release to RubyGems
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
