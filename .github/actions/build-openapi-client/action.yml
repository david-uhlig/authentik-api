name: Build OpenAPI client

description: Regenerate the client with the checked-out branch's `bin/generate-api`.

inputs:
  gem-version:
    description: Gem version to pass to the generator.
    required: true

runs:
  using: composite
  steps:
    # Release lines run their own `bin/generate-api`. All of them support
    # `GEM_VERSION` and read the pinned generator version from
    # `.openapi-generator/Dockerfile`. Older lines use a bash version of it.
    - name: Set up Ruby
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        ruby-version: ruby

    - name: Generate client
      shell: bash
      run: bin/generate-api
      env:
        GEM_VERSION: ${{ inputs.gem-version }}
